<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ridge — close</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,600;1,500&display=swap');
  :root { --bg:#f6f7f9; --text:#15171a; --text-2:#51565f; --text-3:#747b86; --accent:#315ee7; }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:var(--bg);
    color:var(--text); font-family:'DM Sans',sans-serif; -webkit-font-smoothing:antialiased; }
  #stage { width:1920px; height:1080px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:0; }
  .mark { width:132px; height:132px; border-radius:29px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; box-shadow:0 20px 60px rgba(49,94,231,.28); }
  .word { font-family:'Fraunces',serif; font-weight:600; font-size:112px; letter-spacing:-.02em;
    margin-top:44px; line-height:1; }
  .tag { font-size:40px; color:var(--text-2); margin-top:26px; }
  .tag em { font-family:'Fraunces',serif; font-style:italic; font-weight:600; color:var(--text); }
  .url { font-family:'DM Mono',monospace; font-size:29px; color:var(--text-3); margin-top:62px;
    padding:15px 30px; border:1px solid #e0e3e8; border-radius:999px; background:#fff; }
</style>
</head>
<body>
<div id="stage">
  <div class="mark" id="mark">
    <svg width="86" height="86" viewBox="0 0 32 32" fill="none">
      <path id="spark" d="M6 22.5 L11.5 13 L15.5 18 L21 8.5 L26 16.5"
            stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="word" id="word">Ridge</div>
  <div class="tag" id="tag">Answers you can <em>defend</em>.</div>
  <div class="url" id="url">ridge-data.vercel.app</div>
</div>
<script>
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const p=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const ease=x=>x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const pe=(t,a,b)=>ease(p(t,a,b));
const lerp=(a,b,k)=>a+(b-a)*k;

const spark=document.getElementById("spark");
const LEN=spark.getTotalLength();
spark.style.strokeDasharray=LEN;

function seek(t){
  const m=pe(t,0.0,0.9);
  document.getElementById("mark").style.cssText +=
    `;opacity:${m};transform:scale(${lerp(0.9,1,m)})`;
  // The mark draws itself rather than appearing — a small nod to the product's
  // claim that the line is computed, not asserted.
  spark.style.strokeDashoffset = LEN * (1 - pe(t, 0.35, 1.7));

  const w=pe(t,0.9,1.7), g=pe(t,1.4,2.3), u=pe(t,2.1,3.0);
  const set=(id,v,dy)=>{const el=document.getElementById(id);
    el.style.opacity=v; el.style.transform=`translateY(${lerp(dy,0,v)}px)`;};
  set("word",w,18); set("tag",g,14); set("url",u,12);
}
window.seek=seek; window.SCENE_DURATION=8;
seek(0);
</script>
</body>
</html>
