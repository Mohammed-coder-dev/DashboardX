name: Release

# A tag alone never constitutes a release. Verification runs first, and the
# GitHub Release is created only if every check passes — an unverified tag is
# left with no Release attached rather than published as a successful one.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"; exit 1
          fi

      - name: Changelog documents this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"; exit 1
          fi

      - name: Install from the lockfile
        run: npm ci

      - name: Unit and API integration tests
        run: npm test

      - run: npx playwright install --with-deps chromium
      - name: Browser journeys
        run: npm run test:browser
        env:
          CI: "true"

      - name: Build validation
        run: |
          node -e "import('./src/app.js').then(m => { m.createApp(); console.log('app builds'); })"
          PORT=3399 node server.js & SERVER=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3399/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3399/api/health | grep -q '"status":"ok"'
          # / is the landing page and must NOT inline the workspace;
          # /app is the workspace and must carry a working dropzone.
          # Captured first so a failed fetch fails the grep rather than
          # feeding an empty stream to a negated match and passing.
          ROOT=$(curl -sf http://127.0.0.1:3399/)
          echo "$ROOT" | grep -q 'Evidence-backed'
          if echo "$ROOT" | grep -q 'dropzone'; then
            echo '::error::the landing page inlines the workspace'; exit 1
          fi
          curl -sf http://127.0.0.1:3399/app | grep -q 'dropzone'
          kill $SERVER

      - name: No committed secrets
        run: |
          if git grep -nE 'sk-ant-[A-Za-z0-9_-]{24,}' -- . ':!tests' ':!*.md'; then
            echo "::error::possible API key committed"; exit 1
          fi

  publish:
    name: Publish the GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract this version's changelog section
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Everything between this version's heading and the next one.
          awk -v v="## [$VERSION]" '
            $0 ~ "^" v {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no changelog content for $VERSION"; exit 1
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "Verified by the release workflow: unit and API integration tests, browser journeys (desktop and mobile), build validation and a secret scan all passed on \`${GITHUB_SHA}\` before this release was created."
          } >> release-notes.md
          echo "wrote $(wc -l < release-notes.md) lines"

      - name: Create the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Ridge $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
