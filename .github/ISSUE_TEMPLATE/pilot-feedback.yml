name: Pilot feedback
description: Tell us where Ridge helped, where you did not trust it, and what would make it repeatable.
title: "[Pilot] "
labels: ["pilot-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Ridge. **Do not attach your source file, paste confidential rows, or include API keys.** Describe the workflow and result without sharing sensitive data.
  - type: dropdown
    id: role
    attributes:
      label: Your role
      options:
        - Finance or revenue
        - Operations or strategy
        - Data or analytics
        - Engineering or IT
        - Other
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: How did you run Ridge?
      options:
        - Hosted app
        - Self-hosted container
        - Local development
    validations:
      required: true
  - type: textarea
    id: job
    attributes:
      label: What job were you trying to complete?
      description: Describe the decision or recurring spreadsheet workflow, not the underlying confidential data.
      placeholder: I receive a weekly pipeline export and need to validate it before the review meeting.
    validations:
      required: true
  - type: textarea
    id: useful
    attributes:
      label: What was genuinely useful?
      placeholder: A quality issue, comparison, chart, or evidence claim you acted on.
    validations:
      required: true
  - type: textarea
    id: trust_gap
    attributes:
      label: Where did you hesitate or lose trust?
      placeholder: A number you could not verify, a missing method, confusing wording, or a workflow gap.
    validations:
      required: true
  - type: dropdown
    id: repeat
    attributes:
      label: Would you use Ridge again for the same workflow next week?
      options:
        - Yes, without help
        - Yes, if one blocker is fixed
        - Maybe, but the value is unclear
        - No
    validations:
      required: true
  - type: textarea
    id: blocker
    attributes:
      label: What is the one blocker Ridge should solve next?
      placeholder: Keep this to the single change most likely to make you return.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data-safety check
      options:
        - label: I did not include confidential source data, uploaded rows, or API keys in this issue.
          required: true
